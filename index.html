
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="বাংলা খবর এক জায়গায় পড়ুন।">
  <title>Bangla News AI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f5f7;
      color: #222;
      margin: 0;
    }
    header {
      background: #075e45;
      color: white;
      padding: 24px 16px;
      text-align: center;
    }
    main {
      max-width: 850px;
      margin: 20px auto;
      padding: 0 14px;
    }
    .news {
      background: white;
      padding: 18px;
      margin-bottom: 14px;
      border-radius: 10px;
      box-shadow: 0 2px 7px #00000010;
    }
    .source {
      color: #087653;
      font-size: 13px;
    }
    a {
      color: #075eaa;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
    #status { text-align: center; padding: 20px; }
  </style>
</head>
<body>
  <header>
    <h1>বাংলা নিউজ AI</h1>
    <p>দেশ-বিদেশের খবর এক জায়গায়</p>
  </header>

  <main>
    <h2>সর্বশেষ খবর</h2>
    <p id="status">খবর লোড হচ্ছে...</p>
    <div id="news-list"></div>
  </main>

  <script>
    async function loadNews() {
      const status = document.getElementById("status");
      const list = document.getElementById("news-list");

      try {
        const response = await fetch("./news.json");
        if (!response.ok) throw new Error("News file not found");

        const data = await response.json();
        list.replaceChildren();

        if (!data.news || data.news.length === 0) {
          status.textContent = "এখন কোনো খবর পাওয়া যায়নি।";
          return;
        }

        data.news.forEach(item => {
          const card = document.createElement("article");
          card.className = "news";

          const source = document.createElement("p");
          source.className = "source";
          source.textContent = item.source || "সংবাদ উৎস";

          const title = document.createElement("h3");
          const link = document.createElement("a");
          link.textContent = item.title || "শিরোনাম নেই";
          link.href = item.link;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          title.appendChild(link);

          const description = document.createElement("p");
          description.textContent = item.description
            ? item.description.replace(/<[^>]*>/g, "")
            : "বিস্তারিত জানতে মূল খবরটি পড়ুন।";

          card.append(source, title, description);
          list.appendChild(card);
        });

        status.textContent = "মোট " + data.news.length + "টি খবর";
      } catch (error) {
        status.textContent =
          "খবর লোড করা যায়নি। কিছুক্ষণ পরে আবার চেষ্টা করুন।";
      }
    }

    loadNews();
  </script>
</body>
</html>
